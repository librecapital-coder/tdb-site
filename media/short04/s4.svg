<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1280"><rect width="720" height="1280" fill="#f7f8fb"/><rect x="70" y="110" width="580" height="850" rx="38" fill="#fff" stroke="#e6e9ef" stroke-width="4"/><text x="110" y="220" font-family="Arial" font-size="34" font-weight="800" fill="#3157d5">6.º GRADO</text><text x="110" y="355" font-family="Arial" font-size="48" font-weight="900" fill="#172033">La idea importante:</text><text x="110" y="470" font-family="Arial" font-size="40" font-weight="800" fill="#247a4f">el porcentaje es la parte</text><text x="110" y="525" font-family="Arial" font-size="40" font-weight="800" fill="#247a4f">que descuentan.</text><text x="110" y="645" font-family="Arial" font-size="36" fill="#5f6b7a">No es lo que pagas.</text><rect x="110" y="760" width="500" height="120" rx="24" fill="#3157d5"/><text x="360" y="815" text-anchor="middle" font-family="Arial" font-size="27" font-weight="800" fill="#fff">¿Qué tema de 6.º cuesta más?</text><text x="360" y="852" text-anchor="middle" font-family="Arial" font-size="27" font-weight="800" fill="#fff">Dímelo en comentarios.</text><text x="70" y="1110" font-family="Arial" font-size="30" font-weight="900" fill="#172033">Tutor de Bolsillo</text><text x="70" y="1160" font-family="Arial" font-size="24" fill="#5f6b7a">Ayuda escolar práctica para padres</text></svg>