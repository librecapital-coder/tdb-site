<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1280"><rect width="720" height="1280" fill="#ffffff"/><text x="60" y="130" font-family="Arial" font-size="34" font-weight="800" fill="#3157d5">HAZLO VISIBLE</text><text x="60" y="255" font-family="Arial" font-size="50" font-weight="900" fill="#172033">10% de $50 = $5</text><text x="60" y="365" font-family="Arial" font-size="50" font-weight="900" fill="#172033">20% de $50 = $10</text><rect x="90" y="500" width="540" height="260" rx="34" fill="#fff8e6" stroke="#f0b84b" stroke-width="4"/><text x="360" y="605" text-anchor="middle" font-family="Arial" font-size="36" font-weight="800" fill="#9b6a00">DESCUENTO</text><text x="360" y="700" text-anchor="middle" font-family="Arial" font-size="92" font-weight="900" fill="#172033">$10</text><text x="60" y="930" font-family="Arial" font-size="35" font-weight="800" fill="#172033">Primero calcula la parte.</text><text x="60" y="980" font-family="Arial" font-size="35" fill="#5f6b7a">Después resta al precio.</text><text x="60" y="1190" font-family="Arial" font-size="28" font-weight="800" fill="#172033">Tutor de Bolsillo</text></svg>