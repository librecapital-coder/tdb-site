<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1280"><rect width="720" height="1280" fill="#172033"/><text x="60" y="150" font-family="Arial" font-size="36" font-weight="800" fill="#f0b84b">NO CAMBIÓ EL COCIENTE</text><text x="60" y="310" font-family="Arial" font-size="72" font-weight="900" fill="#fff">48 ÷ 6 = 8</text><text x="60" y="470" font-family="Arial" font-size="54" font-weight="900" fill="#f0b84b">Por eso:</text><rect x="70" y="560" width="580" height="210" rx="32" fill="#fff"/><text x="360" y="690" text-anchor="middle" font-family="Arial" font-size="72" font-weight="900" fill="#3157d5">4.8 ÷ 0.6 = 8</text><text x="60" y="930" font-family="Arial" font-size="38" font-weight="800" fill="#fff">Primero entiende el porqué.</text><text x="60" y="985" font-family="Arial" font-size="38" fill="#c9d0dc">Después usa el atajo.</text><text x="60" y="1180" font-family="Arial" font-size="28" font-weight="800" fill="#fff">Tutor de Bolsillo</text></svg>