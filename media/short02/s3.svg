<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1280" viewBox="0 0 720 1280"><rect width="720" height="1280" fill="#172033"/><text x="60" y="150" font-family="Arial,sans-serif" font-size="36" font-weight="800" fill="#f0b84b">LA IDEA CLAVE</text><text x="60" y="270" font-family="Arial,sans-serif" font-size="62" font-weight="900" fill="#ffffff">Los números</text><text x="60" y="340" font-family="Arial,sans-serif" font-size="62" font-weight="900" fill="#ffffff">cambiaron.</text><text x="60" y="470" font-family="Arial,sans-serif" font-size="62" font-weight="900" fill="#f0b84b">La cantidad NO.</text><rect x="90" y="650" width="540" height="190" rx="32" fill="#ffffff"/><text x="360" y="775" text-anchor="middle" font-family="Arial,sans-serif" font-size="82" font-weight="900" fill="#3157d5">1/2 = 2/4</text><text x="360" y="920" text-anchor="middle" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#c9d0dc">Eso es una fracción equivalente.</text><text x="60" y="1170" font-family="Arial,sans-serif" font-size="28" font-weight="800" fill="#ffffff">Tutor de Bolsillo</text></svg>