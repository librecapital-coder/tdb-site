<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1280" viewBox="0 0 720 1280"><rect width="720" height="1280" fill="#f7f8fb"/><text x="60" y="120" font-family="Arial,sans-serif" font-size="34" font-weight="800" fill="#3157d5">MISMO TAMAÑO</text><text x="60" y="190" font-family="Arial,sans-serif" font-size="46" font-weight="800" fill="#172033">Mira estas dos barras</text><rect x="80" y="330" width="560" height="150" rx="24" fill="#ffffff" stroke="#172033" stroke-width="4"/><rect x="80" y="330" width="280" height="150" rx="20" fill="#3157d5"/><line x1="360" y1="330" x2="360" y2="480" stroke="#172033" stroke-width="4"/><text x="360" y="545" text-anchor="middle" font-family="Arial,sans-serif" font-size="46" font-weight="900" fill="#3157d5">1 de 2</text><rect x="80" y="665" width="560" height="150" rx="24" fill="#ffffff" stroke="#172033" stroke-width="4"/><rect x="80" y="665" width="280" height="150" rx="20" fill="#f0b84b"/><line x1="220" y1="665" x2="220" y2="815" stroke="#172033" stroke-width="4"/><line x1="360" y1="665" x2="360" y2="815" stroke="#172033" stroke-width="4"/><line x1="500" y1="665" x2="500" y2="815" stroke="#172033" stroke-width="4"/><text x="360" y="880" text-anchor="middle" font-family="Arial,sans-serif" font-size="46" font-weight="900" fill="#9b6a00">2 de 4</text><text x="60" y="1025" font-family="Arial,sans-serif" font-size="36" font-weight="800" fill="#172033">La parte coloreada</text><text x="60" y="1075" font-family="Arial,sans-serif" font-size="36" font-weight="800" fill="#247a4f">ocupa exactamente lo mismo.</text><text x="60" y="1190" font-family="Arial,sans-serif" font-size="28" font-weight="800" fill="#172033">Tutor de Bolsillo</text></svg>