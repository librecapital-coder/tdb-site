<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex,nofollow" />
  <title>Abriendo checkout | Tutor de Bolsillo</title>
  <style>
    body{margin:0;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f7f8fb;color:#172033;display:grid;place-items:center;min-height:100vh}
    .box{max-width:520px;margin:24px;padding:30px;border:1px solid #e6e9ef;border-radius:22px;background:#fff;text-align:center}
    a{color:#3157d5;font-weight:800}
  </style>
</head>
<body>
  <main class="box">
    <strong>Abriendo el checkout seguro…</strong>
    <p>Si no abre automáticamente, <a id="fallback" href="https://librecap.gumroad.com/l/fracciones-sin-enredos-4to?wanted=true">continúa aquí</a>.</p>
  </main>
  <img src="https://tracker.metricool.com/c3po.jpg?hash=2b4624e422f287e540591a1283849bf" width="1" height="1" alt="" aria-hidden="true" style="position:absolute;left:-9999px;top:-9999px" />
  <script>
    (function(){
      const p=new URLSearchParams(location.search);
      const src=(p.get('src')||'unknown').replace(/[^a-zA-Z0-9_-]/g,'').slice(0,80);
      const u=new URL('https://librecap.gumroad.com/l/fracciones-sin-enredos-4to');
      u.searchParams.set('wanted','true');
      u.searchParams.set('utm_source','tdb-site');
      u.searchParams.set('utm_medium','referral');
      u.searchParams.set('utm_campaign','p001');
      u.searchParams.set('utm_content',src);
      document.getElementById('fallback').href=u.toString();
      setTimeout(function(){ location.replace(u.toString()); },700);
    })();
  </script>
</body>
</html>
